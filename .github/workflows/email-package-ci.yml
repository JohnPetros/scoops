name: Email CI

on:
  pull_request:
    paths:
      - ".github/workflows/email-package-ci.yml"
      - ".code-multivitals.json"
      - "package.json"
      - "packages/email/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/check-complexity.mjs"
      - "scripts/tests/check-complexity.test.mjs"

permissions:
  contents: read

concurrency:
  group: email-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  complexity:
    name: Complexity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check complexity
        run: |
          node --test scripts/tests/check-complexity.test.mjs
          pnpm --filter @scoops/email check:complexity --base HEAD^1
