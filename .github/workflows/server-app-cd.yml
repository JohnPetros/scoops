name: Server Coolify CD

# Pushes to main deploy staging. Production is deployed by the create-release
# workflow, which calls this one after a release PR merges into production.
on:
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - ".github/workflows/server-app-cd.yml"
      - "apps/server/**"
      - "package.json"
      - "packages/core/**"
      - "packages/email/**"
      - "packages/validation/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/coolify-deploy.mjs"
  workflow_call:
    inputs:
      environment:
        description: Deployment environment (staging or production)
        required: true
        type: string
      ref:
        description: Git ref to build and deploy
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - staging
          - production
      ref:
        description: Git ref to build and deploy, such as a release tag (defaults to the selected branch)
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Deploy Server (${{ inputs.environment || 'staging' }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ inputs.environment || 'staging' }}
    concurrency:
      group: server-coolify-${{ inputs.environment || 'staging' }}
      cancel-in-progress: false
    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment || 'staging' }}
      TARGET_MODE: ${{ inputs.environment == 'production' && 'prod' || 'stg' }}
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      COOLIFY_APP_UUID: ${{ vars.COOLIFY_SERVER_APP_UUID }}

    steps:
      - name: Checkout revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Validate deployment configuration
        env:
          SENTRY_ORG: ${{ inputs.environment == 'production' && secrets.SENTRY_ORG || '' }}
          SENTRY_PROJECT: ${{ inputs.environment == 'production' && secrets.SENTRY_SERVER_PRODUCTION_PROJECT || '' }}
          SENTRY_AUTH_TOKEN: ${{ inputs.environment == 'production' && secrets.SENTRY_AUTH_TOKEN || '' }}
        run: |
          case "$TARGET_ENVIRONMENT" in
            staging|production) ;;
            *) echo "Unknown deployment environment: $TARGET_ENVIRONMENT" >&2; exit 1 ;;
          esac
          release_sha="$(git rev-parse HEAD)"
          [[ "$release_sha" =~ ^[a-f0-9]{40}$ ]]
          {
            echo "RELEASE_SHA=$release_sha"
            echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/scoops-server"
            echo "IMAGE_TAG=$TARGET_MODE-$release_sha"
          } >> "$GITHUB_ENV"
          test -n "$COOLIFY_URL"
          test -n "$COOLIFY_API_TOKEN"
          test -n "$COOLIFY_APP_UUID"
          # Only production reports to Sentry.
          if [ "$TARGET_ENVIRONMENT" = production ]; then
            test -n "$SENTRY_ORG"
            test -n "$SENTRY_PROJECT"
            test -n "$SENTRY_AUTH_TOKEN"
          fi

      - name: Sync server environment
        env:
          SERVER_ENV_FILE: ${{ secrets[inputs.environment == 'production' && 'SCOOPS_SERVER_APP_PRODUCTION_ENV' || 'SCOOPS_SERVER_APP_STAGING_ENV'] }}
        run: |
          test -n "$SERVER_ENV_FILE"
          env_file="$RUNNER_TEMP/server.env"
          printf '%s' "$SERVER_ENV_FILE" > "$env_file"
          if grep -Eq '^[[:space:]]*(export[[:space:]]+)?SENTRY_AUTH_TOKEN[[:space:]]*=' "$env_file"; then
            echo 'SENTRY_AUTH_TOKEN must be supplied as a BuildKit secret, never a runtime setting.' >&2
            exit 1
          fi
          if grep -Eq '^[[:space:]]*(export[[:space:]]+)?SCOOPS_RELEASE_SHA[[:space:]]*=' "$env_file"; then
            echo 'SCOOPS_RELEASE_SHA is set by the deployed image and must not override its release.' >&2
            exit 1
          fi
          printf '\nPORT=8080\n' >> "$env_file"
          # Staging never reports to Sentry, even if its env file sets a DSN.
          if [ "$TARGET_ENVIRONMENT" != production ]; then printf 'SENTRY_DSN=\n' >> "$env_file"; fi
          chmod 600 "$env_file"
          node scripts/coolify-deploy.mjs sync-env "$env_file" "$COOLIFY_APP_UUID" "$GITHUB_ENV"

      - name: Validate server runtime configuration
        run: |
          test "$SCOOPS_SERVER_APP_MODE" = "$TARGET_MODE"
          if [ "$TARGET_ENVIRONMENT" = production ]; then test -n "$SENTRY_DSN"; fi
          test -n "$DATABASE_URL"

      - name: Authenticate with GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push server images
        env:
          SENTRY_ORG: ${{ inputs.environment == 'production' && secrets.SENTRY_ORG || '' }}
          SENTRY_PROJECT: ${{ inputs.environment == 'production' && secrets.SENTRY_SERVER_PRODUCTION_PROJECT || '' }}
          SENTRY_AUTH_TOKEN: ${{ inputs.environment == 'production' && secrets.SENTRY_AUTH_TOKEN || '' }}
        run: |
          sentry_args=()
          if [ "$TARGET_ENVIRONMENT" = production ]; then
            sentry_args=(
              --secret "id=sentry_auth_token,env=SENTRY_AUTH_TOKEN"
              --build-arg "SENTRY_ORG=$SENTRY_ORG"
              --build-arg "SENTRY_PROJECT=$SENTRY_PROJECT"
            )
          fi
          for target in runtime release; do
            suffix=""
            if [ "$target" = release ]; then suffix="-release"; fi
            DOCKER_BUILDKIT=1 docker build \
              --provenance=false \
              --sbom=false \
              --platform linux/amd64 \
              --target "$target" \
              "${sentry_args[@]}" \
              --build-arg "SCOOPS_SERVER_APP_MODE=$TARGET_MODE" \
              --build-arg "SCOOPS_RELEASE_SHA=$RELEASE_SHA" \
              --tag "$IMAGE_NAME:$IMAGE_TAG$suffix" \
              --file apps/server/Dockerfile \
              .
            docker push "$IMAGE_NAME:$IMAGE_TAG$suffix"
          done

      - name: Apply database migrations
        run: docker run --rm -e DATABASE_URL "$IMAGE_NAME:$IMAGE_TAG-release"

      - name: Release server
        run: node scripts/coolify-deploy.mjs deploy "$COOLIFY_APP_UUID" "$IMAGE_TAG"
