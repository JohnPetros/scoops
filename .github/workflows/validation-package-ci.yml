name: Validation CI

on:
  pull_request:
    paths:
      - ".github/workflows/validation-package-ci.yml"
      - "biome.json"
      - ".code-multivitals.json"
      - "package.json"
      - "packages/core/**"
      - "packages/validation/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/check-complexity.mjs"
      - "scripts/comment-complexity-report.mjs"
      - "scripts/tests/check-complexity.test.mjs"
      - "scripts/tests/comment-complexity-report.test.mjs"
      - ".dependency-cruiser.mjs"

permissions:
  contents: read

concurrency:
  group: validation-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation_code:
    name: Validation code
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code
        run: pnpm --filter @scoops/validation check:lint

  validation_architecture:
    name: Validation architecture
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check architecture
        run: pnpm --filter @scoops/validation check:architecture

  validation_types:
    name: Validation types
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm --filter @scoops/validation check:types

  validation:
    name: Validation
    if: ${{ always() }}
    needs:
      - validation_code
      - validation_architecture
      - validation_types
    runs-on: ubuntu-latest
    steps:
      - name: Require all Validation checks
        env:
          VALIDATION_CODE_RESULT: ${{ needs.validation_code.result }}
          VALIDATION_ARCHITECTURE_RESULT: ${{ needs.validation_architecture.result }}
          VALIDATION_TYPES_RESULT: ${{ needs.validation_types.result }}
        run: |
          if [[ "$VALIDATION_CODE_RESULT" != "success" || "$VALIDATION_ARCHITECTURE_RESULT" != "success" || "$VALIDATION_TYPES_RESULT" != "success" ]]; then
            echo "Validation code result: $VALIDATION_CODE_RESULT"
            echo "Validation architecture result: $VALIDATION_ARCHITECTURE_RESULT"
            echo "Validation types result: $VALIDATION_TYPES_RESULT"
            exit 1
          fi

  complexity:
    name: Complexity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check complexity
        id: complexity
        run: |
          node --test scripts/tests/check-complexity.test.mjs scripts/tests/comment-complexity-report.test.mjs
          pnpm --filter @scoops/validation check:complexity --base HEAD^1 --output "$GITHUB_WORKSPACE/complexity-report.md"

      - name: Publish Validation complexity on pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.complexity.outputs.findings != '' }}
        uses: actions/github-script@v9
        env:
          HAS_FINDINGS: ${{ steps.complexity.outputs.findings }}
        with:
          script: |
            const { commentComplexityReport } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/comment-complexity-report.mjs`
            )
            const outcome = await commentComplexityReport({
              github,
              context,
              workspace: 'validation',
              reportPath: `${process.env.GITHUB_WORKSPACE}/complexity-report.md`,
              hasFindings: process.env.HAS_FINDINGS === 'true',
            })
            core.info(`Complexity comment: ${outcome}`)
